# PS-SPLIT / PSSPLIT runtime environment.
# Verified on Linux x86_64 with an NVIDIA GPU (driver >= 515, CUDA 11.7 wheels).
#
#   conda env create -f environment.yml
#   conda activate pssplit
#
# Everything except the Python interpreter is installed from PyPI so that the
# torch / torchvision / xformers triple stays consistent.
name: pssplit
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # --- core numerics (torch 2.0.0 requires numpy < 2) ---
      - numpy==1.24.3
      - scipy==1.11.3
      - pandas==1.5.3
      - scikit-learn==1.3.0     # >= 1.3 required for sklearn.cluster.HDBSCAN
      - matplotlib==3.8.0
      - Pillow==10.0.1
      - six==1.16.0
      - tqdm==4.65.0

      # --- deep learning ---
      - torch==2.0.0            # cu117 wheels from PyPI
      - torchvision==0.15.1
      - timm==0.9.10
      - xformers==0.0.19        # REQUIRED: models/vision_transformer2.py does
                                # `from xformers.ops import SwiGLU` at import
                                # time. 0.0.19 is the release pinned to torch 2.0.0.

      # --- logging ---
      - tensorboard==2.12.1

      # --- clustering / K-estimation ---
      - kmeans-pytorch==0.3     # SelEx contrastive training
      - pyclustering==0.10.1.2  # REQUIRED for the x-means / g-means estimators

      # --- optional: lazily imported by methods/estimate_k/estimate_k_hdbscan.py ---
      - optuna==4.8.0
